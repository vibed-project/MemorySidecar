name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -race -count=1 ./...

  integration:
    name: integration (postgres, minio)
    runs-on: ubuntu-latest
    # Every production driver -- postgres for kv/episodic/semantic/graph/lease
    # and s3 for artifact -- lives behind the `integration` build tag, so the
    # unit job above compiles none of them. Without this job the only storage
    # code CI has ever executed is the in-memory drivers, and the shared
    # conformance suite it runs is exactly what caught the kv version race.
    # Ubuntu runners ship a Docker daemon, which is all testcontainers needs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: integration tests
        # Each package starts its own containers, so this is slower than the
        # unit job; 25m leaves headroom without hanging a stuck run forever.
        run: go test -tags=integration -count=1 -timeout=25m ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      # No released golangci-lint is built with go 1.26 yet, and a linter built
      # with an older Go refuses to type-check a go 1.26 module. Build it from
      # source with the toolchain set up below (GOTOOLCHAIN=local stops go from
      # auto-downgrading to golangci-lint's required 1.25 toolchain).
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install golangci-lint (built with go 1.26)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  sdk-python:
    name: python sdk
    runs-on: ubuntu-latest
    # The Python SDK had no automated test execution anywhere: not in CI, and
    # not in release-python-sdk.yml, which only builds and runs `twine check`.
    # A broken dependency floor or a stale proto stub could only be discovered
    # by a user after publish.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (at the declared dependency floors)
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: import the generated stubs
        working-directory: sdk/python
        # Catches the class of bug where the committed stubs need a newer
        # protobuf/grpcio than pyproject.toml declares: the import and the
        # stub construction are what actually fail.
        run: |
          python -c "
          import grpc, mindd.kv.v1.kv_pb2_grpc as m
          m.KVStub(grpc.insecure_channel('localhost:1'))
          print('generated stubs import and construct')
          "
      - name: pytest
        working-directory: sdk/python
        # Note: every test in sdk/python/tests is skipif'd on MINDD_TOKEN /
        # MINDD_ADDR, so without a live server this only proves the suite
        # imports and collects. The stub check above is what actually has
        # teeth. Running them for real needs a mindd instance in the job.
        run: pytest -q

  sdk-typescript:
    name: typescript sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build + test
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm test

  proto:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf format --diff --exit-code
