name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      # No released golangci-lint is built with go 1.26 yet, and a linter built
      # with an older Go refuses to type-check a go 1.26 module. Build it from
      # source with the toolchain set up below (GOTOOLCHAIN=local stops go from
      # auto-downgrading to golangci-lint's required 1.25 toolchain).
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install golangci-lint (built with go 1.26)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  proto:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf format --diff --exit-code
