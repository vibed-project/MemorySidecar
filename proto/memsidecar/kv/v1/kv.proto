syntax = "proto3";

package memsidecar.kv.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "memsidecar/gen/memsidecar/kv/v1;kvv1";

// KV provides typed, TTL'd key-value storage scoped by namespace.
// Every RPC requires a capability token carried in the gRPC metadata
// key "x-memsidecar-capability" with value "Bearer <token>".
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  // MultiGet fetches many keys in one round-trip. Missing/expired keys are
  // omitted from the response, so semantic/graph-style batch reads no longer
  // cost one RPC per key.
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream KVItem);
}

message GetRequest {
  string namespace = 1;
  string key = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  string content_type = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint64 version = 6;
  map<string, string> metadata = 7;
}

message MultiGetRequest {
  string namespace = 1;
  repeated string keys = 2;
}

message MultiGetResponse {
  // Found items only; missing or expired keys are omitted. Ordered by key, and
  // deduplicated when the request repeats a key.
  repeated KVItem items = 1;
}

message PutRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  string content_type = 4;
  // 0 or unset = no expiry.
  google.protobuf.Duration ttl = 5;
  map<string, string> metadata = 6;
  // Optimistic concurrency: if set, the write succeeds only when the
  // current stored version equals if_version.
  optional uint64 if_version = 7;
}

message PutResponse {
  uint64 version = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message DeleteRequest {
  string namespace = 1;
  string key = 2;
  optional uint64 if_version = 3;
}

message DeleteResponse {
  bool existed = 1;
}

message ScanRequest {
  string namespace = 1;
  string key_prefix = 2;
  // 0 = unbounded.
  uint32 limit = 3;
  bool include_values = 4;
  // Resume cursor: an exclusive lower bound on key (byte order). Pass the last
  // key from the previous page to continue; empty starts from the beginning.
  // Scan streams keys in ascending byte order, so the last key received is the
  // next token.
  string start_after = 5;
}

message KVItem {
  string key = 1;
  bytes value = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  uint64 version = 5;
  map<string, string> metadata = 6;
  string content_type = 7;
}
