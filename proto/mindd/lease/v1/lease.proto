syntax = "proto3";

package mindd.lease.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vibed-project/mindD/gen/mindd/lease/v1;leasev1";

// Lease provides distributed locks scoped by namespace. A lease is identified
// by (namespace, key). Holders are fenced by a server-assigned holder_id —
// Renew and Release require it.
//
// Every RPC requires a capability token in the gRPC metadata key
// "x-mindd-capability" with value "Bearer <token>".
service Lease {
  rpc Acquire(AcquireRequest) returns (AcquireResponse);
  rpc Renew(RenewRequest) returns (RenewResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // List returns every currently-held (unexpired) lease in a namespace.
  // Inspect is single-key; List enables deadlock/orphan discovery and cleanup.
  rpc List(ListRequest) returns (ListResponse);
}

message AcquireRequest {
  string namespace = 1;
  string key = 2;
  // Time until the lease auto-expires if not Renewed. Required.
  google.protobuf.Duration ttl = 3;
  // If the key is held, wait up to this long for it to free. 0 = fail fast.
  google.protobuf.Duration wait_for = 4;
  map<string, string> metadata = 5;
}

message AcquireResponse {
  LeaseHandle handle = 1;
}

message RenewRequest {
  string holder_id = 1;
  string namespace = 2;
  string key = 3;
  google.protobuf.Duration ttl = 4;
}

message RenewResponse {
  LeaseHandle handle = 1;
}

message ReleaseRequest {
  string holder_id = 1;
  string namespace = 2;
  string key = 3;
}

message ReleaseResponse {
  bool existed = 1;
}

message InspectRequest {
  string namespace = 1;
  string key = 2;
}

message InspectResponse {
  bool held = 1;
  LeaseHandle handle = 2;
}

message ListRequest {
  string namespace = 1;
}

message ListResponse {
  // Held leases in the namespace, ordered by key. Expired leases are omitted.
  repeated LeaseHandle leases = 1;
}

message LeaseHandle {
  // Server-assigned UUID. Renew and Release MUST present it.
  string holder_id = 1;
  string namespace = 2;
  string key = 3;
  google.protobuf.Timestamp acquired_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  map<string, string> metadata = 6;
}
