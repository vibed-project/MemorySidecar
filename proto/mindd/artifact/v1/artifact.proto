syntax = "proto3";

package mindd.artifact.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vibed-project/mindD/gen/mindd/artifact/v1;artifactv1";

// Artifact provides blob storage with metadata, scoped by namespace.
// Every RPC requires a capability token in the gRPC metadata key
// "x-mindd-capability" with value "Bearer <token>".
//
// Put is client-streaming: the first message must carry PutInit, every
// subsequent message must carry PutChunk. Get is server-streaming: the
// first message carries GetHeader (metadata), every subsequent message
// carries GetChunk.
service Artifact {
  rpc Put(stream PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (stream GetResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // List enumerates a namespace's artifacts as a stream of ArtifactMeta in
  // ascending id order. Artifact is otherwise addressable only by known id;
  // List lets an agent discover contents without an external index.
  rpc List(ListRequest) returns (stream ArtifactMeta);
}

message PutRequest {
  oneof body {
    PutInit init = 1;
    PutChunk chunk = 2;
  }
}

message PutInit {
  string namespace = 1;
  // Client-provided id. If empty, the server assigns a UUID.
  string id = 2;
  string content_type = 3;
  map<string, string> metadata = 4;
}

message PutChunk {
  bytes data = 1;
}

message PutResponse {
  ArtifactRef ref = 1;
}

message GetRequest {
  string namespace = 1;
  string id = 2;
  // Optional byte range. Offset is 0-based; length=0 means until end of object.
  uint64 offset = 3;
  uint64 length = 4;
}

message GetResponse {
  oneof body {
    GetHeader header = 1;
    GetChunk chunk = 2;
  }
}

message GetHeader {
  ArtifactMeta meta = 1;
}

message GetChunk {
  bytes data = 1;
}

message StatRequest {
  string namespace = 1;
  string id = 2;
}

message StatResponse {
  bool found = 1;
  ArtifactMeta meta = 2;
}

message DeleteRequest {
  string namespace = 1;
  string id = 2;
}

message DeleteResponse {
  bool existed = 1;
}

message ListRequest {
  string namespace = 1;
  // Exact-match metadata filter: an artifact matches when every (k,v) pair is
  // present in its metadata. Empty matches all.
  map<string, string> filter = 2;
  // Resume cursor: an exclusive lower bound on id. Pass the last id from the
  // previous page to continue; empty starts from the beginning. Because List
  // streams ids in ascending order, the last id received is the next token.
  string start_after = 3;
  // Maximum artifacts to return. 0 = unbounded.
  uint32 limit = 4;
}

message ArtifactRef {
  string id = 1;
  uint64 size = 2;
  string content_type = 3;
  // Hex-encoded SHA-256 of the stored bytes, computed at write time.
  string sha256 = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ArtifactMeta {
  string id = 1;
  uint64 size = 2;
  string content_type = 3;
  string sha256 = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp created_at = 6;
}
