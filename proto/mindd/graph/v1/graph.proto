syntax = "proto3";

package mindd.graph.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vibed-project/mindD/gen/mindd/graph/v1;graphv1";

// Graph provides relationship-aware recall: node/edge upserts and bounded,
// structured traversal, scoped by namespace (ADR-0002). It FRONTS graph
// engines — it does not implement storage, indexing, a query planner, a
// query language, or any reasoning/entity-resolution. Traversal is always
// bounded server-side. Every RPC requires a capability token in the gRPC
// metadata key "x-mindd-capability" with value "Bearer <token>".
service Graph {
  // Writes — idempotent upserts keyed by caller-supplied ids.
  rpc UpsertNodes(UpsertNodesRequest) returns (UpsertNodesResponse);
  rpc UpsertEdges(UpsertEdgesRequest) returns (UpsertEdgesResponse);

  // Reads.
  rpc GetNode(GetNodeRequest) returns (Node);
  rpc Neighbors(NeighborsRequest) returns (NeighborsResponse); // 1-hop, filtered
  rpc Traverse(TraverseRequest) returns (Subgraph); // bounded multi-hop

  // Deletes.
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse);
}

// Direction of edges to follow in a read. Unspecified is treated as BOTH.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_OUT = 1;
  DIRECTION_IN = 2;
  DIRECTION_BOTH = 3;
}

message Node {
  // Caller-supplied id. Can be shared with a semantic record id to seed a
  // "semantic search then graph expand" recall pattern (orchestrated by the
  // agent, not the sidecar). Empty is rejected on upsert.
  string id = 1;
  repeated string labels = 2; // entity types, e.g. ["Person"]
  map<string, string> props = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Edge {
  string id = 1; // caller-supplied; empty is rejected on upsert
  string type = 2; // relationship type, e.g. "AUTHORED"
  string from = 3; // source node id
  string to = 4; // target node id
  map<string, string> props = 5;
  google.protobuf.Timestamp created_at = 6;
  // Bitemporal validity (ADR-0002 Phase 4, mirrors semantic ADR-0003). The
  // relationship holds while valid_from <= t < valid_to. Unset valid_from means
  // "always started"; unset valid_to means "open-ended". Default reads exclude
  // edges not valid now; existing edges (both unset) read as always-valid.
  google.protobuf.Timestamp valid_from = 7;
  google.protobuf.Timestamp valid_to = 8;
}

message UpsertNodesRequest {
  string namespace = 1;
  repeated Node nodes = 2;
}

message UpsertNodesResponse {
  repeated string ids = 1;
}

message UpsertEdgesRequest {
  string namespace = 1;
  repeated Edge edges = 2;
}

message UpsertEdgesResponse {
  repeated string ids = 1;
}

message GetNodeRequest {
  string namespace = 1;
  string id = 2;
}

message NeighborsRequest {
  string namespace = 1;
  string node_id = 2;
  repeated string edge_types = 3; // empty = any type
  Direction direction = 4;
  repeated string node_labels = 5; // filter returned neighbors; empty = any
  // Fan-out cap. 0 = server default. Hard-capped server-side.
  uint32 limit = 6;
  // Evaluate edge validity at this instant instead of now (point-in-time).
  google.protobuf.Timestamp as_of = 7;
}

message NeighborsResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message TraverseRequest {
  string namespace = 1;
  string start_id = 2;
  repeated string edge_types = 3;
  Direction direction = 4;
  // Max hops. 0 = server default (1). Hard-capped server-side.
  uint32 depth = 5;
  // Result-size cap (total nodes). 0 = server default. Hard-capped server-side.
  uint32 max_nodes = 6;
  // Evaluate edge validity at this instant instead of now (point-in-time).
  google.protobuf.Timestamp as_of = 7;
}

message Subgraph {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message DeleteNodeRequest {
  string namespace = 1;
  string id = 2;
  // If true, also delete edges incident to the node. If false and edges still
  // reference the node, the delete is rejected with FailedPrecondition.
  bool cascade = 3;
}

message DeleteNodeResponse {
  bool existed = 1;
}

message DeleteEdgeRequest {
  string namespace = 1;
  string id = 2;
}

message DeleteEdgeResponse {
  bool existed = 1;
}
