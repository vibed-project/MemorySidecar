syntax = "proto3";

package mindd.admin.v1;

option go_package = "github.com/vibed-project/mindD/gen/mindd/admin/v1;adminv1";

// Admin exposes read-only server introspection: which namespaces exist, how
// they are configured, and their live item counts. It is cross-namespace and
// requires the admin.inspect op (no per-namespace scope is checked).
//
// Every RPC requires a capability token in the gRPC metadata key
// "x-mindd-capability" with value "Bearer <token>".
service Admin {
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  ServerInfo server = 1;
  // All configured namespaces, ordered by (block, name).
  repeated NamespaceInfo namespaces = 2;
}

message ServerInfo {
  string version = 1;
  string commit = 2;
}

message NamespaceInfo {
  string block = 1;
  string name = 2;
  // Configured backend name and its driver ("memory" | "postgres" | "fs" | "s3").
  string backend = 3;
  string driver = 4;
  // Live item count when the backing driver can report it cheaply. has_count is
  // false when the driver has no cheap size (e.g. the fs/s3 artifact drivers),
  // in which case item_count is 0 and should be ignored.
  int64 item_count = 5;
  bool has_count = 6;
  // Embedder, populated for semantic namespaces only (empty provider otherwise).
  EmbedderInfo embedder = 7;
}

message EmbedderInfo {
  string provider = 1;
  string model = 2;
  uint32 dimensions = 3;
}
