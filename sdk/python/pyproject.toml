[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "memsidecar"
version = "0.1.0"
description = "Python client for the memsidecar agent memory sidecar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "memsidecar contributors" }]
keywords = ["memsidecar", "agent", "memory", "grpc", "llm", "sidecar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.60",
    # gencode comes from `buf generate --template buf.gen.python.yaml` which
    # uses a recent protocolbuffers/python plugin; runtime must match or newer.
    "protobuf>=7.35",
]

[project.urls]
Homepage = "https://github.com/vibed-project/MemorySidecar"
Repository = "https://github.com/vibed-project/MemorySidecar"
Documentation = "https://github.com/vibed-project/MemorySidecar/tree/main/website/docs"
Issues = "https://github.com/vibed-project/MemorySidecar/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# Framework adapters (memsidecar.ext.*). Each is optional and pulls in its
# framework only when installed, e.g. `pip install memsidecar[langgraph]`.
langgraph = [
    "langgraph-checkpoint>=2.0,<5",
]
crewai = [
    "crewai>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memsidecar"]

[tool.hatch.build.targets.sdist]
include = ["src/memsidecar/**", "README.md"]
