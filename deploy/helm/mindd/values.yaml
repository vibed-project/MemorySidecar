# Default values for the mindd Helm chart.

replicaCount: 1

image:
  repository: mindd
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Service exposes three ports:
#   grpc   — gRPC TCP
#   http   — grpc-gateway (JSON/HTTP)
#   metrics — Prometheus /metrics
service:
  type: ClusterIP
  grpcPort: 7777
  httpPort: 8080
  metricsPort: 9090
  annotations: {}

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness / readiness via the standard gRPC health protocol.
probes:
  enabled: true
  initialDelaySeconds: 2
  periodSeconds: 10

# mindd config. Rendered into a ConfigMap and mounted at
# /etc/mindd/config.yaml. The dev keypair below is for testing only —
# replace it for any real deployment.
config:
  server:
    grpc:
      tcp: "0.0.0.0:7777"
      # UDS doesn't make sense across pods; leave empty by default.
      uds: ""
    http:
      addr: "0.0.0.0:8080"
    shutdown_timeout: 10s

  observability:
    tracing:
      exporter: stdout
      sample_ratio: 1.0
    metrics:
      exporter: prometheus
      prometheus:
        addr: "0.0.0.0:9090"
        path: /metrics
    logging:
      level: info
      format: json

  auth:
    verifier: paseto
    paseto:
      # DEV key — override for real deployments.
      public_key_hex: "61a2d0067233cf8d6570c76f37573cbc31d33032ab256fe0c8032c0987d0fbf9"

  policy:
    default: allow
    rules: []

  backends:
    - name: mem-default
      driver: memory

  namespaces:
    - { block: kv, name: scratchpad, backend: mem-default }
    - { block: episodic, name: events, backend: mem-default }
    - { block: artifact, name: blobs, backend: mem-default }
    - { block: lease, name: locks, backend: mem-default }

# Extra environment variables passed to the container. Use this to inject
# secrets (e.g. Postgres DSN, S3 credentials) via env from an external Secret.
env: []
# - name: MINDD_PG_DSN
#   valueFrom:
#     secretKeyRef:
#       name: mindd-pg
#       key: dsn

# TLS material. When `tls.enabled` is true, a Secret with the named keys must
# already exist OR be provided inline via tls.cert/tls.key.
tls:
  enabled: false
  existingSecret: ""   # name of a pre-existing Secret with tls.crt/tls.key
  # Inline literals (rendered into a Secret). Leave empty if existingSecret
  # is set.
  cert: ""
  key: ""
  # Optional CA bundle to verify client certs (enables mTLS).
  clientCA: ""
  requireClientCert: false

# Prometheus ServiceMonitor — set to true if prometheus-operator is installed.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
