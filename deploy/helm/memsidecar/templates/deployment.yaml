apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memsidecar.fullname" . }}
  labels:
    {{- include "memsidecar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "memsidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memsidecar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Re-roll the pod on a config change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "memsidecar.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: memsidecar
          image: {{ include "memsidecar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/memsidecar/config.yaml
          ports:
            - name: grpc
              containerPort: 7777
              protocol: TCP
            {{- if .Values.config.server.http.addr }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
            {{- if and .Values.config.observability.metrics (eq .Values.config.observability.metrics.exporter "prometheus") }}
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            grpc:
              port: 7777
              service: memsidecar.kv.v1.KV
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            grpc:
              port: 7777
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/memsidecar
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/memsidecar/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "memsidecar.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "memsidecar.tlsSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
